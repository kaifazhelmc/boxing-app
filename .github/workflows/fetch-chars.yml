name: 下載 SpriteCook 角色圖（一次性）

on:
  push:
    branches: [main]
    paths: [".github/workflows/fetch-chars.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下載並縮成 512px
        run: |
          mkdir -p img/chars
          dl(){ curl -fsSL --retry 3 -o "img/chars/$1.png" "$2"; }
          dl striker-1 "https://api.spritecook.ai/v1/assets/5d67ef3b-bcf7-4fce-aada-50b35e150d42/signed-content/raw?sig=vcl1xqa_vcwECVBYt_hua-N25S_9SionG3Q--QXxECs&exp=1794372191"
          dl swift-1   "https://api.spritecook.ai/v1/assets/3b6c6b0d-d0da-4482-b392-488c3afd5962/signed-content/raw?sig=zYldQFhSK_mCWdQmBkQecKKViiES7gRuws9Q7OQj09g&exp=1794372191"
          dl guard-1   "https://api.spritecook.ai/v1/assets/dcd307e7-e995-40dc-9aab-81fe0343522b/signed-content/raw?sig=N9q1kJ35n4xHpB8GZNG858nm0n5bkPwgyl47Ggzi-20&exp=1794372191"
          dl monk-1    "https://api.spritecook.ai/v1/assets/067c3025-3142-4aaa-af30-2461770a3cdd/signed-content/raw?sig=COF6UEs95Xtu-3potw1qmhOXD0vVGY_pDUF7KMHB7Zc&exp=1794372191"
          python3 -m pip install -q pillow
          python3 - <<'PY'
          import glob, hashlib, json
          from PIL import Image
          man = json.load(open("spritecook-assets.json", encoding="utf-8"))
          for f in sorted(glob.glob("img/chars/*.png")):
              im = Image.open(f).convert("RGBA")
              bbox = im.getbbox()
              if bbox: im = im.crop(bbox)
              im.thumbnail((512, 512), Image.LANCZOS)
              im.save(f, optimize=True)
              man[f]["sha12"] = hashlib.sha256(open(f, "rb").read()).hexdigest()[:12]
              print(f, im.size)
          json.dump(man, open("spritecook-assets.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
      - name: 提交圖片並移除這個一次性工作
        run: |
          git config user.name "boxing-bot"
          git config user.email "boxing-bot@users.noreply.github.com"
          git rm -q .github/workflows/fetch-chars.yml
          git add img/chars spritecook-assets.json
          git commit -m "加入 SpriteCook 角色圖 PNG（striker/swift/guard/monk tier 1）"
          git push
